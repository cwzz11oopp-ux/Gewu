<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1350" viewBox="0 0 2000 1350" role="img" aria-labelledby="title desc">
  <title id="title">格物自动科研系统的完整闭环体系</title>
  <desc id="desc">从问题结构化、文献证据、假设生成、证据推理、人工选择、计划治理、实验代码、真实运行、结果审计到科学反馈，并包含证据补检、计划复审、工程修复、科学迭代和报告审计五个受控闭环。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#163a59" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-main" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#3d6480"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#138366"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#bb514e"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#cb7620"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#1674b8"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", sans-serif; fill: #17344c; }
      .title { font-size: 42px; font-weight: 700; fill: #126aa4; }
      .subtitle { font-size: 21px; fill: #537086; }
      .section { font-size: 20px; font-weight: 700; fill: #126aa4; letter-spacing: 1px; }
      .node { fill: #f8fbfe; stroke: #83afd0; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .node-num { fill: #126aa4; }
      .num-text { fill: #ffffff; font-size: 19px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .node-title { font-size: 22px; font-weight: 700; fill: #173f5d; text-anchor: middle; }
      .node-copy { font-size: 16px; fill: #506b7e; text-anchor: middle; }
      .decision-copy { font-size: 14px; fill: #506b7e; text-anchor: middle; }
      .node-key { font-size: 15px; font-weight: 700; fill: #126aa4; text-anchor: middle; }
      .main-arrow { fill: none; stroke: #3d6480; stroke-width: 3; marker-end: url(#arrow-main); }
      .loop-green { fill: none; stroke: #138366; stroke-width: 3.5; marker-end: url(#arrow-green); }
      .loop-red { fill: none; stroke: #bb514e; stroke-width: 3.5; marker-end: url(#arrow-red); }
      .loop-orange { fill: none; stroke: #cb7620; stroke-width: 4; marker-end: url(#arrow-orange); }
      .loop-blue { fill: none; stroke: #1674b8; stroke-width: 3.5; marker-end: url(#arrow-blue); }
      .loop-label { font-size: 17px; font-weight: 700; text-anchor: middle; }
      .loop-detail { font-size: 15px; text-anchor: middle; }
      .green { fill: #138366; }
      .red { fill: #bb514e; }
      .orange { fill: #b96416; }
      .blue { fill: #126aa4; }
      .plan-inner { fill: #eeeafa; stroke: #8d78bf; stroke-width: 1.5; rx: 9; }
      .plan-text { fill: #644c9f; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .decision { fill: #fff7e9; stroke: #d99a42; stroke-width: 2.2; }
      .report { fill: #eef7fd; stroke: #4b9aca; stroke-width: 2.2; rx: 16; filter: url(#shadow); }
      .audit { fill: #f8fbfe; stroke: #7aa6c3; stroke-width: 2; rx: 16; }
      .export { fill: #eaf7ef; stroke: #55a978; stroke-width: 2.2; rx: 16; filter: url(#shadow); }
      .guard-band { fill: #f4f8fb; stroke: #c8d8e4; stroke-width: 1.5; rx: 16; }
      .guard-title { font-size: 20px; font-weight: 700; fill: #173f5d; }
      .guard-pill { fill: #ffffff; stroke: #a8c1d2; stroke-width: 1.5; rx: 12; }
      .guard-head { font-size: 16px; font-weight: 700; fill: #126aa4; text-anchor: middle; }
      .guard-copy { font-size: 14px; fill: #526d80; text-anchor: middle; }
    </style>
  </defs>

  <rect width="2000" height="1350" fill="#ffffff"/>
  <text class="title" x="70" y="65">格物自动科研系统的完整闭环体系</text>
  <text class="subtitle" x="70" y="105">一条可追溯主链 + 五个受控反馈闭环；所有回流均有触发条件、修订对象、停止规则和人工接管出口</text>
  <text class="section" x="70" y="153">主科研链路（10 个核心节点）</text>

  <!-- Row 1 -->
  <g transform="translate(40 180)">
    <rect class="node" width="320" height="170"/>
    <circle class="node-num" cx="30" cy="30" r="19"/><text class="num-text" x="30" y="31">1</text>
    <text class="node-title" x="160" y="53">问题与约束结构化</text>
    <text class="node-copy" x="160" y="88"><tspan x="160">研究目标 · 数据集 · 约束条件</tspan><tspan x="160" dy="25">指标、阈值与优化意图冻结</tspan></text>
    <text class="node-key" x="160" y="150">输出：结构化研究问题</text>
  </g>
  <g transform="translate(420 180)">
    <rect class="node" width="320" height="170"/>
    <circle class="node-num" cx="30" cy="30" r="19"/><text class="num-text" x="30" y="31">2</text>
    <text class="node-title" x="160" y="53">文献与证据整合</text>
    <text class="node-copy" x="160" y="88"><tspan x="160">Wiki · 本地库 · 外部检索</tspan><tspan x="160" dy="25">来源核验、去重、缺口与限制提取</tspan></text>
    <text class="node-key" x="160" y="150">输出：可追溯证据注册表</text>
  </g>
  <g transform="translate(800 180)">
    <rect class="node" width="320" height="170"/>
    <circle class="node-num" cx="30" cy="30" r="19"/><text class="num-text" x="30" y="31">3</text>
    <text class="node-title" x="160" y="53">候选假设生成</text>
    <text class="node-copy" x="160" y="88"><tspan x="160">由真实研究缺口形成候选</tspan><tspan x="160" dy="25">明确机制、预测、风险和可证伪性</tspan></text>
    <text class="node-key" x="160" y="150">输出：候选假设集合</text>
  </g>
  <g transform="translate(1180 180)">
    <rect class="node" width="320" height="170"/>
    <circle class="node-num" cx="30" cy="30" r="19"/><text class="num-text" x="30" y="31">4</text>
    <text class="node-title" x="160" y="53">逐项证据推理</text>
    <text class="node-copy" x="160" y="88"><tspan x="160">候选逐项独立审查与证据映射</tspan><tspan x="160" dy="25">GO / REVISE / 补检 / REJECT</tspan></text>
    <text class="node-key" x="160" y="150">输出：证据化候选评估</text>
  </g>
  <g transform="translate(1560 180)">
    <rect class="node" width="320" height="170"/>
    <circle class="node-num" cx="30" cy="30" r="19"/><text class="num-text" x="30" y="31">5</text>
    <text class="node-title" x="160" y="53">人工选择门</text>
    <text class="node-copy" x="160" y="88"><tspan x="160">展示支持、冲突、风险与未知项</tspan><tspan x="160" dy="25">由用户选择进入实验的假设</tspan></text>
    <text class="node-key" x="160" y="150">输出：锁定研究假设</text>
  </g>

  <path class="main-arrow" d="M360 265 H410"/><path class="main-arrow" d="M740 265 H790"/>
  <path class="main-arrow" d="M1120 265 H1170"/><path class="main-arrow" d="M1500 265 H1550"/>

  <!-- Evidence grounding loop -->
  <path class="loop-green" d="M1340 350 V408 H580 V356"/>
  <text class="loop-label green" x="960" y="388">闭环 A｜证据不足 → 定向补检 → 重新推理（最多 2 轮）</text>

  <!-- Row 2, right to left -->
  <path class="main-arrow" d="M1720 350 V470"/>
  <g transform="translate(1560 480)">
    <rect class="node" width="320" height="180"/>
    <circle class="node-num" cx="30" cy="30" r="19"/><text class="num-text" x="30" y="31">6</text>
    <text class="node-title" x="160" y="50">方案生成与独立治理</text>
    <rect class="plan-inner" x="26" y="74" width="82" height="34"/><rect class="plan-inner" x="119" y="74" width="82" height="34"/><rect class="plan-inner" x="212" y="74" width="82" height="34"/>
    <text class="plan-text" x="67" y="96">生成</text><text class="plan-text" x="160" y="96">评审</text><text class="plan-text" x="253" y="96">定点修订 ↺</text>
    <text class="node-copy" x="160" y="128"><tspan x="160">仅当阻断项清零才 ACCEPT</tspan><tspan x="160" dy="22">超出有界修订次数转人工</tspan></text>
    <text class="node-key" x="160" y="171">闭环 B｜计划治理</text>
  </g>
  <g transform="translate(1180 480)">
    <rect class="node" width="320" height="180"/>
    <circle class="node-num" cx="30" cy="30" r="19"/><text class="num-text" x="30" y="31">7</text>
    <text class="node-title" x="160" y="52">实验代码与执行前检</text>
    <text class="node-copy" x="160" y="89"><tspan x="160">Bundle、数据加载、依赖与种子冻结</tspan><tspan x="160" dy="25">静态校验 · 预检 · smoke-test</tspan><tspan x="160" dy="25">失败只进入工程修复，不形成结论</tspan></text>
  </g>
  <g transform="translate(800 480)">
    <rect class="node" width="320" height="180"/>
    <circle class="node-num" cx="30" cy="30" r="19"/><text class="num-text" x="30" y="31">8</text>
    <text class="node-title" x="160" y="52">真实代码实验运行</text>
    <text class="node-copy" x="160" y="89"><tspan x="160">本地或远程 GPU 执行</tspan><tspan x="160" dy="25">进度监测、检查点与可恢复重试</tspan><tspan x="160" dy="25">保留计划—代码—结果不可变谱系</tspan></text>
  </g>
  <g transform="translate(420 480)">
    <rect class="node" width="320" height="180"/>
    <circle class="node-num" cx="30" cy="30" r="19"/><text class="num-text" x="30" y="31">9</text>
    <text class="node-title" x="160" y="52">结果分析与完整性审计</text>
    <text class="node-copy" x="160" y="89"><tspan x="160">逐种子指标、统计量与不确定性</tspan><tspan x="160" dy="25">异常、数据与运行完整性核验</tspan><tspan x="160" dy="25">区分工程失败与科学结果</tspan></text>
  </g>
  <g transform="translate(40 480)">
    <rect class="node decision" width="320" height="180" rx="16" filter="url(#shadow)"/>
    <circle cx="30" cy="30" r="19" fill="#cb7620"/><text class="num-text" x="30" y="31">10</text>
    <text class="node-title" x="160" y="52">科学反馈判断</text>
    <text class="decision-copy" x="160" y="83"><tspan x="160">Qwen 结果分析 + DeepSeek 独立复核</tspan><tspan x="160" dy="23">结论：SUPPORTED / CONTRADICTED</tspan><tspan x="160" dy="23">或 INCONCLUSIVE</tspan><tspan x="160" dy="23">路由：REPORT / REVISE / PIVOT</tspan></text>
  </g>

  <path class="main-arrow" d="M1560 570 H1510"/><path class="main-arrow" d="M1180 570 H1130"/>
  <path class="main-arrow" d="M800 570 H750"/><path class="main-arrow" d="M420 570 H370"/>

  <!-- Engineering repair loop -->
  <path class="loop-red" d="M960 660 V715 H1340 V666"/>
  <text class="loop-label red" x="1150" y="701">闭环 C｜工程故障诊断 → 代码 / 数据 / 依赖修复 → 同轮重试（最多 5 次）</text>

  <!-- Scientific iteration loop -->
  <path class="loop-orange" d="M200 660 V805 H1720 V666"/>
  <text class="loop-label orange" x="960" y="768">闭环 D｜REVISE / PIVOT → 定向证据更新 → 计划修订 → 下一轮真实实验</text>
  <text class="loop-detail orange" x="960" y="795">最多 4 轮；连续 2 轮无提升停止；仅同协议配对且 95% CI 为正时替换当前最优</text>

  <!-- Report branch and audit loop -->
  <path class="main-arrow" d="M200 660 V865"/>
  <text class="loop-detail orange" x="310" y="842">REPORT 或达到停止条件</text>
  <g transform="translate(40 875)">
    <rect class="report" width="470" height="165"/>
    <text class="node-title" x="235" y="45">研究报告生成</text>
    <text class="node-copy" x="235" y="83"><tspan x="235">汇总问题、证据、方案、真实结果与迭代谱系</tspan><tspan x="235" dy="26">参考文献覆盖本次检索到的全部可导出来源</tspan></text>
    <text class="node-key" x="235" y="140">报告草稿</text>
  </g>
  <path class="loop-blue" d="M510 957 H660"/>
  <g transform="translate(670 875)">
    <rect class="audit" width="470" height="165"/>
    <text class="node-title" x="235" y="45">事实、引用与结论边界审计</text>
    <text class="node-copy" x="235" y="83"><tspan x="235">核对数值、单位、比较方向、来源支持</tspan><tspan x="235" dy="26">只修复被定位的段落，再次复核</tspan></text>
    <text class="node-key" x="235" y="140">闭环 E｜有界局部修复 ↺</text>
  </g>
  <path class="loop-blue" d="M905 1040 V1082 H275 V1046"/>
  <path class="main-arrow" d="M1140 957 H1290"/>
  <g transform="translate(1300 875)">
    <rect class="export" width="570" height="165"/>
    <text class="node-title" x="285" y="48">合格后导出与复现</text>
    <text class="node-copy" x="285" y="86"><tspan x="285">生成 Word / PDF 作品材料</tspan><tspan x="285" dy="26">保留实验参数、种子、环境、证据与版本记录</tspan></text>
    <text class="node-key" x="285" y="143">最终出口：可审计、可复现的研究成果</text>
  </g>

  <!-- Guard rails -->
  <g transform="translate(40 1140)">
    <rect class="guard-band" width="1830" height="165"/>
    <text class="guard-title" x="28" y="38">闭环控制边界</text>
    <g transform="translate(28 60)"><rect class="guard-pill" width="420" height="78"/><text class="guard-head" x="210" y="28">证据闭环</text><text class="guard-copy" x="210" y="54">只引用已核验来源；补检最多 2 轮</text></g>
    <g transform="translate(470 60)"><rect class="guard-pill" width="420" height="78"/><text class="guard-head" x="210" y="28">计划与工程闭环</text><text class="guard-copy" x="210" y="54">阻断项清零才执行；工程失败不冒充科学结果</text></g>
    <g transform="translate(912 60)"><rect class="guard-pill" width="420" height="78"/><text class="guard-head" x="210" y="28">科学优化闭环</text><text class="guard-copy" x="210" y="54">单变量、同协议比较、有上限且可停止</text></g>
    <g transform="translate(1354 60)"><rect class="guard-pill" width="448" height="78"/><text class="guard-head" x="224" y="28">治理与人工接管</text><text class="guard-copy" x="224" y="54">超限或证据不足时暂停，不以猜测继续</text></g>
  </g>

  <text x="1870" y="1330" text-anchor="end" font-size="14" fill="#7890a0">图：格物完整科研闭环（依据当前项目状态机与审计策略绘制）</text>
</svg>
